name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no GPU/audio hardware needed for the test suite)
        run: |
          sudo apt-get update && sudo apt-get install -y xdotool
          python -m pip install --upgrade pip
          pip install -e ".[dev,tray]"
          python -c "import sounddevice" || pip install sounddevice
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Clean venv install + entry point smoke test
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install dist/*.whl
          /tmp/clean-venv/bin/stt-daemon --help
